<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Editor</title>
  <style>
    :root {
      --bg:     #1e1e2e;
      --bg2:    #181825;
      --bg3:    #313244;
      --border: #45475a;
      --text:   #cdd6f4;
      --dim:    #6c7086;
      --blue:   #89b4fa;
      --green:  #a6e3a1;
      --red:    #f38ba8;
      --yellow: #f9e2af;
      --mauve:  #cba6f7;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

    /* ─── Shell ─── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ─── Topbar ─── */
    #topbar { display: flex; align-items: center; gap: 8px; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 6px 12px; flex-shrink: 0; }
    #topbar h1 { font-size: 13px; font-weight: 700; color: var(--blue); }
    .spacer { flex: 1; }
    .btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .btn:hover { background: var(--border); }
    .btn.primary { background: var(--blue); color: var(--bg2); border-color: var(--blue); font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: var(--bg2); }

    /* ─── Body ─── */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* ─── Sidebar ─── */
    #sidebar { width: 220px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #sidebar-head { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
    #sidebar-head span { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; flex: 1; }
    #file-tree { flex: 1; overflow-y: auto; padding: 4px 0; }

    .folder-hd { display: flex; align-items: center; gap: 5px; padding: 4px 10px; cursor: pointer; user-select: none; color: var(--dim); font-size: 12px; }
    .folder-hd:hover { background: var(--bg3); color: var(--text); }
    .folder-arrow { display: inline-block; width: 10px; transition: transform .15s; }
    .folder.open > .folder-hd .folder-arrow { transform: rotate(90deg); }
    .folder-body { display: none; }
    .folder.open > .folder-body { display: block; }

    .file-row { padding: 3px 10px 3px 24px; cursor: pointer; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 3px; margin: 1px 4px; }
    .file-row:hover { background: var(--bg3); color: var(--text); }
    .file-row.active { background: var(--bg3); color: var(--blue); }

    /* ─── Editor area ─── */
    #editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--dim); }
    #empty .big { font-size: 40px; opacity: .3; }

    #editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #editor-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 5px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #file-label { flex: 1; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-label.dirty::after { content: ' ●'; color: var(--yellow); }

    .view-btns { display: flex; gap: 2px; }
    .view-btns .btn { padding: 2px 8px; font-size: 11px; }
    .view-btns .btn.on { background: var(--blue); color: var(--bg); border-color: var(--blue); }

    #panes { flex: 1; display: flex; overflow: hidden; }

    #md-editor { flex: 1; background: var(--bg); color: var(--text); border: none; outline: none; resize: none; padding: 16px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.65; tab-size: 2; }

    #md-preview { flex: 1; overflow-y: auto; padding: 16px 24px; background: var(--bg); border-left: 1px solid var(--border); }

    /* ─── Preview markdown ─── */
    #md-preview h1,#md-preview h2,#md-preview h3,#md-preview h4 { color: var(--blue); margin: 14px 0 6px; }
    #md-preview h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    #md-preview h2 { font-size: 16px; }
    #md-preview h3 { font-size: 14px; }
    #md-preview p { margin: 6px 0; line-height: 1.7; }
    #md-preview a { color: var(--blue); }
    #md-preview code { background: var(--bg3); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 12px; }
    #md-preview pre { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    #md-preview pre code { background: none; padding: 0; }
    #md-preview blockquote { border-left: 3px solid var(--blue); padding-left: 12px; color: var(--dim); margin: 8px 0; }
    #md-preview ul,#md-preview ol { padding-left: 20px; margin: 6px 0; }
    #md-preview li { margin: 3px 0; }
    #md-preview hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    #md-preview table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #md-preview th,#md-preview td { border: 1px solid var(--border); padding: 5px 8px; }
    #md-preview th { background: var(--bg2); }
    #md-preview strong { color: var(--mauve); }
    #md-preview em { color: var(--yellow); }

    /* ─── Statusbar ─── */
    #statusbar { background: var(--blue); color: var(--bg); padding: 2px 12px; display: flex; gap: 12px; font-size: 11px; flex-shrink: 0; }

    /* ─── Modals ─── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; align-items: center; justify-content: center; }
    .overlay.show { display: flex; }
    .dialog { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px; min-width: 320px; }
    .dialog h2 { font-size: 13px; margin-bottom: 12px; }
    .dialog label { font-size: 11px; color: var(--dim); display: block; margin-bottom: 3px; }
    .dialog select, .dialog input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
    .dialog-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .git-status-box { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-family: monospace; font-size: 11px; color: var(--dim); max-height: 100px; overflow-y: auto; white-space: pre; margin-bottom: 10px; min-height: 32px; }

    /* ─── Toast ─── */
    #toast { display: none; position: fixed; bottom: 36px; right: 16px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 100; }
    #toast.ok  { border-color: var(--green); color: var(--green); }
    #toast.err { border-color: var(--red);   color: var(--red);   }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>📝 Vault Editor</h1>
    <div class="spacer"></div>
    <button class="btn" onclick="UI.newFile()">+ New</button>
    <button class="btn" onclick="UI.deleteFile()">Delete</button>
    <button class="btn" onclick="UI.gitModal()">⎇ Commit</button>
  </div>

  <div id="body">
    <div id="sidebar">
      <div id="sidebar-head">
        <span>Vault</span>
        <button class="btn" style="padding:2px 6px;font-size:10px" onclick="Tree.load()">↻</button>
      </div>
      <div id="file-tree">
        <div style="padding:10px 12px;color:var(--dim)">Loading…</div>
      </div>
    </div>

    <div id="editor-area">
      <div id="empty">
        <div class="big">📄</div>
        <div>Select a file to start editing</div>
        <div style="font-size:11px;margin-top:4px;color:var(--dim)">or click <strong>+ New</strong> to create one</div>
      </div>
      <div id="editor-wrap" style="display:none">
        <div id="editor-bar">
          <span id="file-label">—</span>
          <div class="view-btns">
            <button class="btn on" id="vb-edit"    onclick="setView('edit')">Edit</button>
            <button class="btn"    id="vb-split"   onclick="setView('split')">Split</button>
            <button class="btn"    id="vb-preview" onclick="setView('preview')">Preview</button>
          </div>
          <button class="btn primary" onclick="Editor.save()">Save</button>
        </div>
        <div id="panes">
          <textarea id="md-editor" spellcheck="false"
            oninput="Editor.onInput()"
            onkeydown="Editor.onKey(event)"></textarea>
          <div id="md-preview" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="sb-sse">⚪ Connecting…</span>
    <span id="sb-path"></span>
  </div>
</div>

<!-- New file modal -->
<div class="overlay" id="modal-new" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="dialog">
    <h2>New File</h2>
    <label>Folder</label>
    <select id="nf-folder">
      <option>Architecture</option>
      <option>Flows</option>
      <option>Sequences</option>
      <option>Infrastructure</option>
      <option>Notes</option>
    </select>
    <label>Filename (without .md)</label>
    <input type="text" id="nf-name" placeholder="e.g. auth-flow"
      onkeydown="if(event.key==='Enter')UI.createFile()">
    <div class="dialog-btns">
      <button class="btn" onclick="document.getElementById('modal-new').classList.remove('show')">Cancel</button>
      <button class="btn primary" onclick="UI.createFile()">Create</button>
    </div>
  </div>
</div>

<!-- Git modal -->
<div class="overlay" id="modal-git" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="dialog">
    <h2>Commit to Git</h2>
    <div class="git-status-box" id="git-status-box">Loading…</div>
    <label>Commit message</label>
    <input type="text" id="git-msg" value="docs: update vault"
      onkeydown="if(event.key==='Enter')UI.doCommit()">
    <div class="dialog-btns">
      <button class="btn" onclick="document.getElementById('modal-git').classList.remove('show')">Cancel</button>
      <button class="btn primary" onclick="UI.doCommit()">Commit &amp; Push</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
const state = { currentPath: null, originalContent: '', dirty: false, view: 'edit' };

// ─── Tree ─────────────────────────────────────────────────────────────────────
const Tree = {
  async load() {
    try {
      const res = await fetch('/api/diagrams');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const files = await res.json();
      this.render(files);
    } catch (e) {
      document.getElementById('file-tree').innerHTML =
        '<div style="padding:10px 12px;color:var(--red)">Failed to load vault</div>';
    }
  },

  render(files) {
    if (!files.length) {
      document.getElementById('file-tree').innerHTML =
        '<div style="padding:10px 12px;color:var(--dim);font-size:12px">No files yet.<br>Click <strong>+ New</strong> to create one.</div>';
      return;
    }
    const folders = {}, root = [];
    files.forEach(f => {
      const slash = f.indexOf('/');
      if (slash === -1) root.push(f);
      else { const d = f.slice(0, slash); (folders[d] = folders[d] || []).push(f); }
    });
    const ORDER = ['Architecture', 'Flows', 'Sequences', 'Infrastructure', 'Notes'];
    const sorted = [
      ...ORDER.filter(d => folders[d]),
      ...Object.keys(folders).filter(d => !ORDER.includes(d)).sort()
    ];
    const tree = document.getElementById('file-tree');
    tree.innerHTML = '';
    root.forEach(f => tree.appendChild(this.makeRow(f)));
    sorted.forEach(dir => {
      const fold = document.createElement('div');
      fold.className = 'folder open';
      fold.innerHTML = `<div class="folder-hd" onclick="this.parentElement.classList.toggle('open')"><span class="folder-arrow">▶</span> 📁 ${dir}</div><div class="folder-body"></div>`;
      folders[dir].forEach(f => fold.querySelector('.folder-body').appendChild(this.makeRow(f)));
      tree.appendChild(fold);
    });
  },

  makeRow(filePath) {
    const div = document.createElement('div');
    div.className = 'file-row' + (filePath === state.currentPath ? ' active' : '');
    div.dataset.path = filePath;
    div.title = filePath;
    div.textContent = '📄 ' + filePath.split('/').pop().replace(/\.md$/, '');
    div.onclick = () => Editor.open(filePath);
    return div;
  },

  setActive(path) {
    document.querySelectorAll('.file-row').forEach(el =>
      el.classList.toggle('active', el.dataset.path === path)
    );
  }
};

// ─── Editor ───────────────────────────────────────────────────────────────────
const Editor = {
  async open(path) {
    if (state.dirty && !confirm('You have unsaved changes. Discard?')) return;
    try {
      const res = await fetch('/api/diagrams/' + path);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      state.currentPath = path;
      state.originalContent = data.content;
      state.dirty = false;
      document.getElementById('md-editor').value = data.content;
      this.setLabel(path, false);
      document.getElementById('sb-path').textContent = path;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('editor-wrap').style.display = 'flex';
      if (state.view !== 'edit') this.updatePreview();
      Tree.setActive(path);
    } catch (e) {
      toast('Failed to open: ' + path, 'err');
    }
  },

  async save() {
    if (!state.currentPath) return;
    const content = document.getElementById('md-editor').value;
    try {
      const res = await fetch('/api/diagrams/' + state.currentPath, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.originalContent = content;
      state.dirty = false;
      this.setLabel(state.currentPath, false);
      toast('Saved ✓', 'ok');
    } catch (e) {
      toast('Save failed', 'err');
    }
  },

  onInput() {
    const content = document.getElementById('md-editor').value;
    const dirty = content !== state.originalContent;
    if (dirty !== state.dirty) { state.dirty = dirty; this.setLabel(state.currentPath, dirty); }
    if (state.view !== 'edit') this.updatePreview();
  },

  onKey(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); this.save(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart, n = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(n);
      ta.selectionStart = ta.selectionEnd = s + 2;
      this.onInput();
    }
  },

  setLabel(path, dirty) {
    const el = document.getElementById('file-label');
    el.textContent = path || '—';
    el.classList.toggle('dirty', !!dirty);
  },

  updatePreview() {
    document.getElementById('md-preview').innerHTML =
      marked.parse(document.getElementById('md-editor').value);
  }
};

// ─── View mode ────────────────────────────────────────────────────────────────
function setView(v) {
  state.view = v;
  ['edit','split','preview'].forEach(x =>
    document.getElementById('vb-' + x).classList.toggle('on', x === v)
  );
  document.getElementById('md-editor').style.display  = v === 'preview' ? 'none' : '';
  document.getElementById('md-preview').style.display = v === 'edit'    ? 'none' : '';
  if (v !== 'edit') Editor.updatePreview();
}

// ─── UI actions ───────────────────────────────────────────────────────────────
const UI = {
  newFile() {
    document.getElementById('nf-name').value = '';
    document.getElementById('modal-new').classList.add('show');
    setTimeout(() => document.getElementById('nf-name').focus(), 50);
  },

  async createFile() {
    const folder = document.getElementById('nf-folder').value;
    const name   = document.getElementById('nf-name').value.trim().replace(/\.md$/, '');
    if (!name) { toast('Enter a filename', 'err'); return; }
    const path    = folder + '/' + name + '.md';
    const today   = new Date().toISOString().slice(0, 10);
    const content = '---\ntitle: ' + name + '\ncreated: ' + today + '\n---\n\n# ' + name + '\n\n';
    try {
      const res = await fetch('/api/diagrams/' + path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      document.getElementById('modal-new').classList.remove('show');
      await Tree.load();
      await Editor.open(path);
      toast('Created ✓', 'ok');
    } catch (e) {
      toast('Create failed', 'err');
    }
  },

  async deleteFile() {
    if (!state.currentPath) return;
    if (!confirm('Delete ' + state.currentPath + '?')) return;
    try {
      const res = await fetch('/api/diagrams/' + state.currentPath, { method: 'DELETE' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.currentPath = null;
      state.dirty = false;
      document.getElementById('editor-wrap').style.display = 'none';
      document.getElementById('empty').style.display = 'flex';
      document.getElementById('sb-path').textContent = '';
      await Tree.load();
      toast('Deleted', 'ok');
    } catch (e) {
      toast('Delete failed', 'err');
    }
  },

  async gitModal() {
    document.getElementById('git-status-box').textContent = 'Loading…';
    document.getElementById('modal-git').classList.add('show');
    try {
      const res = await fetch('/api/git/status');
      const data = await res.json();
      document.getElementById('git-status-box').textContent = data.status || '(nothing to commit)';
    } catch {
      document.getElementById('git-status-box').textContent = 'Could not read git status';
    }
    document.getElementById('git-msg').value = 'docs: update vault';
    setTimeout(() => document.getElementById('git-msg').focus(), 50);
  },

  async doCommit() {
    const msg = document.getElementById('git-msg').value.trim() || 'docs: update vault';
    document.getElementById('modal-git').classList.remove('show');
    try {
      const res = await fetch('/api/git/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      toast(res.ok ? 'Committed ✓' : 'Commit failed', res.ok ? 'ok' : 'err');
    } catch {
      toast('Commit failed', 'err');
    }
  }
};

// ─── SSE ──────────────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onopen  = () => { document.getElementById('sb-sse').textContent = '🟢 Live'; };
  es.onerror = () => {
    document.getElementById('sb-sse').textContent = '🔴 Disconnected';
    es.close();
    setTimeout(connectSSE, 3000);
  };
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.event === 'diagram_added' || d.event === 'diagram_removed') Tree.load();
  };
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let _tt = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type || '';
  el.style.display = 'block';
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ─── Global keys ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
});

// ─── Init ─────────────────────────────────────────────────────────────────────
Tree.load();
connectSSE();
</script>
</body>
</html>
