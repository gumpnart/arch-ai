version: "3.9"

services:
  # ── Bridge: vault file API + SSE live-reload ─────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: arch-doc-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./diagrams-vault:/diagrams-vault
    environment:
      - VAULT_DIR=/diagrams-vault
      - PORT=3001
    networks:
      - arch-doc-net

  # ── Kroki: diagram-as-code renderer (shared by arch-doc-mcp + mcp-server) ─
  kroki:
    image: yuzutech/kroki
    container_name: arch-doc-kroki
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - KROKI_MERMAID_HOST=mermaid
    networks:
      - arch-doc-net

  mermaid:
    image: yuzutech/kroki-mermaid
    container_name: arch-doc-mermaid
    restart: unless-stopped
    expose:
      - "8002"
    networks:
      - arch-doc-net

  # ── MCP server: diagram-as-code tools (render + vault + git) ─────────────
  # HTTP mode (default): serves /mcp endpoint on PORT
  # Stdio mode (Claude Desktop): docker exec -i arch-doc-mcp node /app/dist/index.js --stdio
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: arch-doc-mcp-server
    container_name: arch-doc-mcp
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./diagrams-vault:/vault
    environment:
      - KROKI_URL=http://kroki:8000
      - VAULT_PATH=/vault
      - PORT=3002
    depends_on:
      - kroki
    networks:
      - arch-doc-net

  # ── TLS proxy: HTTPS for Claude Desktop / Claude Code connectors ──────────
  mcp-tls:
    build:
      context: ./nginx-tls
      dockerfile: Dockerfile
    container_name: arch-doc-mcp-tls
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - ./certs:/certs
    depends_on:
      - mcp-server
    networks:
      - arch-doc-net

networks:
  arch-doc-net:
    driver: bridge
