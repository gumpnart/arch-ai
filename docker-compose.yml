version: "3.9"

services:
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: excalidraw-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./scenes:/scenes
      - ./diagrams-vault:/diagrams-vault
    environment:
      - SCENES_DIR=/scenes
      - VAULT_DIR=/diagrams-vault
      - PORT=3001
    networks:
      - excalidraw-net

  excalidraw-app:
    build:
      context: ./excalidraw-app
      dockerfile: Dockerfile
    container_name: excalidraw-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - bridge
    networks:
      - excalidraw-net

  kroki:
    image: yuzutech/kroki
    container_name: excalidraw-kroki
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - KROKI_MERMAID_HOST=mermaid
    networks:
      - excalidraw-net

  mermaid:
    image: yuzutech/kroki-mermaid
    container_name: excalidraw-mermaid
    restart: unless-stopped
    expose:
      - "8002"
    networks:
      - excalidraw-net

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: excalidraw-mcp-server
    container_name: excalidraw-mcp
    restart: unless-stopped
    volumes:
      - ./diagrams-vault:/vault
    environment:
      - BRIDGE_URL=http://bridge:3001
      - KROKI_URL=http://kroki:8000
      - VAULT_PATH=/vault
    depends_on:
      - bridge
      - kroki
    networks:
      - excalidraw-net
    entrypoint: ["tail", "-f", "/dev/null"]

  mcp-http:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: excalidraw-mcp-server
    container_name: excalidraw-mcp-http
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./diagrams-vault:/vault
    environment:
      - BRIDGE_URL=http://bridge:3001
      - KROKI_URL=http://kroki:8000
      - VAULT_PATH=/vault
      - PORT=3002
    depends_on:
      - mcp-server
      - bridge
      - kroki
    networks:
      - excalidraw-net

networks:
  excalidraw-net:
    driver: bridge

volumes:
  scenes:
