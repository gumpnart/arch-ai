version: "3.9"

services:
  # ── Bridge: vault file API + SSE live-reload ─────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: excalidraw-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./diagrams-vault:/diagrams-vault
    environment:
      - VAULT_DIR=/diagrams-vault
      - PORT=3001
    networks:
      - excalidraw-net

  # ── Kroki: diagram-as-code renderer ──────────────────────────────────────
  kroki:
    image: yuzutech/kroki
    container_name: excalidraw-kroki
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - KROKI_MERMAID_HOST=mermaid
    networks:
      - excalidraw-net

  mermaid:
    image: yuzutech/kroki-mermaid
    container_name: excalidraw-mermaid
    restart: unless-stopped
    expose:
      - "8002"
    networks:
      - excalidraw-net

  # ── MCP server: diagram-as-code tools (render + vault + git) ─────────────
  # HTTP mode (default): serves /mcp endpoint on PORT
  # Stdio mode (Claude Desktop): docker exec -i excalidraw-mcp node /app/dist/index.js --stdio
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: diagrams-mcp-server
    container_name: diagrams-mcp
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./diagrams-vault:/vault
    environment:
      - KROKI_URL=http://kroki:8000
      - VAULT_PATH=/vault
      - PORT=3002
    depends_on:
      - kroki
    networks:
      - excalidraw-net

  # ── TLS proxy: HTTPS for Claude Desktop / Claude Code connectors ──────────
  mcp-tls:
    build:
      context: ./nginx-tls
      dockerfile: Dockerfile
    container_name: diagrams-mcp-tls
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - ./certs:/certs
    depends_on:
      - mcp-server
    networks:
      - excalidraw-net

  # ── Vault Editor: BlockNote-based markdown + diagram editor ───────────────
  vault-editor:
    build:
      context: ./vault-editor
      dockerfile: Dockerfile
    container_name: diagrams-vault-editor
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - bridge
    networks:
      - excalidraw-net

networks:
  excalidraw-net:
    driver: bridge
